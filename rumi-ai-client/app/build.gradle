plugins { id 'com.android.application' }
android {
    namespace 'com.rumitx.rumiai'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rumitx.rumiai'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0-api-preview'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
