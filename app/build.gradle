apply plugin: 'com.android.application'

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.rumitx.app"
        minSdkVersion 26  // Android 8.0 (S80 runs 8.1)
        targetSdkVersion 27
        versionCode 20301031
        versionName "2.3.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Hidden Android 8.1 HIDL signatures only; real types are supplied by device firmware.
    compileOnly files('libs/hidl-compile-stubs.jar')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.mapsforge:mapsforge-map-android:0.25.0'
    implementation 'org.mapsforge:mapsforge-themes:0.25.0'
}
