apply plugin: 'com.android.application'

android {
    // Newer compile SDK required by AndroidX; Android 8.1 min/target unchanged.
    lintOptions { disable 'ExpiredTargetSdkVersion' }
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.rumitx.app"
        minSdkVersion 26  // Android 8.0 (S80 runs 8.1)
        targetSdkVersion 27
        ndk { abiFilters 'arm64-v8a' }
        versionCode 20301049
        versionName "2.3.2-llama-bundled"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // HIDL APIs are provided by Android 8.1 firmware; never bundled.
    compileOnly files('libs/hidl-compile-stubs.jar')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.mapsforge:mapsforge-map-android:0.25.0'
    implementation 'org.mapsforge:mapsforge-themes:0.25.0'
}
