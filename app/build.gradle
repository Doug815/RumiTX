apply plugin: 'com.android.application'

android {
    // S80 is Android 8.1: intentionally retain target API 27 for this sideloaded field device.
    lintOptions { disable 'ExpiredTargetSdkVersion' }
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.rumitx.app"
        minSdkVersion 26  // Android 8.0 (S80 runs 8.1)
        targetSdkVersion 27
        versionCode 20301043
        versionName "2.3.1-v3-natural-voice-chat"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Signature jar for Android 8.1 hidden HIDL APIs; compileOnly, NEVER bundled.
    compileOnly files('libs/hidl-compile-stubs.jar')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.mapsforge:mapsforge-map-android:0.25.0'
    implementation 'org.mapsforge:mapsforge-themes:0.25.0'
}
