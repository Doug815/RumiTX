name: RumiTX v2.4.0 agent API with bundled llama.cpp
on:
  push:
    branches:
      - feature/llama-bundled
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 33, NDK r27 and build tools
        shell: bash
        run: |
          set -euxo pipefail
          TOOL="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          "$TOOL" --sdk_root="$ANDROID_HOME" --install "platforms;android-33" "build-tools;33.0.2" "ndk;27.2.12479018"
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf ninja-build
      - name: Set up Gradle 7.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'
      - name: Verify application version and radio voice-TX guards
        shell: bash
        run: |
          set -euxo pipefail
          grep -F 'versionCode 20400000' app/build.gradle
          grep -F 'versionName "2.4.0-agent-api"' app/build.gradle
          grep -F 'applicationId "com.rumitx.app"' app/build.gradle
          grep -F 'VoiceTxBridge.isTransmitting()' app/src/main/java/com/rumitx/app/PttDispatcher.java
          grep -F 'VoiceTxBridge.isTransmitting()' app/src/main/java/com/rumitx/app/MainActivity.java
          grep -F 'Voice TX in progress' app/src/main/java/com/rumitx/app/MainActivity.java
          if grep -Fq 'android:debuggable="true"' app/src/main/AndroidManifest.xml; then
            echo 'Release cannot be debuggable' >&2; exit 1
          fi
      - name: Test Google Drive large-model confirmation handler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-tests
          javac -d .ci-tests app/src/main/java/com/rumitx/app/GoogleDriveConfirmation.java tools/tests/GoogleDriveConfirmationTest.java
          java -cp .ci-tests com.rumitx.app.GoogleDriveConfirmationTest
          python3 - <<'PY'
          from pathlib import Path
          src=Path("app/src/main/java/com/rumitx/app/LlamaModelManager.java").read_text()
          start=src.index("File model=file(ctx);",src.index("File ensureDownloaded("))
          verify=src.index("verifySha256(model,callback)",start)
          storage=src.index("verifyStorage(ctx)",start)
          assert start < verify < storage, "Existing local GGUF must be verified before download or storage checks"
          assert "EXPECTED_SHA256" in src and "importFromUri(" in src
          ui=Path("app/src/main/java/com/rumitx/app/LlamaChatActivity.java").read_text()
          assert "Intent.ACTION_OPEN_DOCUMENT" in ui and "LlamaModelManager.importFromUri(" in ui
          print("Existing model reuse + manual file import wiring verified")
          PY
      - name: Verify normal chat, voice bar, native token streaming and intent dispatch
        shell: bash
        run: |
          set -euo pipefail
          javac -d .ci-tests app/src/main/java/com/rumitx/app/RadioIntentParser.java app/src/main/java/com/rumitx/app/RumiChatRouter.java tools/tests/RadioIntentParserSmokeTest.java
          java -cp .ci-tests com.rumitx.app.RadioIntentParserSmokeTest
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/java/com/rumitx/app")
          a=(root/"LlamaChatActivity.java").read_text()
          bridge=(root/"LlamaBridge.java").read_text()
          native=Path("app/src/main/cpp/rumitx_llama_jni.cpp").read_text()
          assert 'versionCode 20400000' in Path("app/build.gradle").read_text()
          assert 'Process.setThreadPriority(Process.THREAD_PRIORITY_BACKGROUND)' in a
          assert 'nativeEngine.generateStreaming(' in a
          assert 'new String(bytes,StandardCharsets.UTF_8)' in a
          assert 'RadioIntentParser.parse(question)' in a
          assert 'RumiChatRouter.greeting(question)' in a
          assert 'voice=new RumiVoice(' in a and 'outer.addView(bottom)' in a
          assert 'MIC · TALK' in a and 'SPEAK: OFF' in a and 'scroller.fullScroll' in a
          assert '"<|im_start|>assistant\n<think>\n\n</think>\n\n"' not in a # source is Java-escaped
          assert '/no_think<|im_end|>' in a
          assert 'onPartial(byte[] utf8)' in bridge
          assert 'nativeGenerateStream(' in native and 'env->CallVoidMethod(listener' in native
          assert 'cp.n_threads=2' in native
          assert 'nativeGenerate(' not in native
          assert 'DB_VERSION = 4' in (root/"ChannelDatabase.java").read_text()
          assert 'verifySha256(model,callback)' in (root/"LlamaModelManager.java").read_text()
          print("PASS: UI, streaming, voice, bounded CPU, chat, DB and model loader invariants")
          PY
      - name: Test local repeater Q&A and inference timeout invariants
        shell: bash
        run: |
          set -euo pipefail
          javac -d .ci-tests app/src/main/java/com/rumitx/app/RadioIntentParser.java app/src/main/java/com/rumitx/app/RepeaterQuestion.java tools/tests/RepeaterQuestionTest.java
          java -cp .ci-tests com.rumitx.app.RepeaterQuestionTest
          python3 - <<'PY'
          from pathlib import Path
          app=Path("app/src/main/java/com/rumitx/app")
          a=(app/"LlamaChatActivity.java").read_text()
          bridge=(app/"LlamaBridge.java").read_text()
          cpp=Path("app/src/main/cpp/rumitx_llama_jni.cpp").read_text()
          search=(app/"RepeaterLocalSearch.java").read_text()
          assert 'versionCode 20400000' in Path("app/build.gradle").read_text()
          assert 'private static final long INFERENCE_TIMEOUT_MS=30000L;' in a
          assert 'current.cancelGeneration()' in a
          assert 'nativeCancelGeneration(long handle)' in bridge
          assert 'cp.abort_callback=' in cpp
          assert 'nativeCancelGeneration(' in cpp
          assert 'RepeaterLocalSearch.search(getApplicationContext(),request)' in a
          assert a.index('RadioIntentParser.parse(question)')<a.index('RepeaterQuestion.parse(question)')
          assert 'SQLiteDatabase.OPEN_READONLY' in search
          assert 'LIMIT=10' in search
          assert 'getDatabasePath("repeaters.db")' in search
          assert 'getDatabasePath("rumitx.db")' in search
          assert 'SQLiteDatabase.openDatabase(' in search
          assert 'getWritableDatabase()' not in search and 'execSQL(' not in search
          assert 'DB_VERSION = 4' in (app/"ChannelDatabase.java").read_text()
          assert 'verifySha256(model,callback)' in (app/"LlamaModelManager.java").read_text()
          print("PASS: read-only RAG search, native timeout/cancel, channel command priority, DB v4 and GGUF loader")
          PY
      - name: Regression test persisted V4 database and older schema migrations
        run: python3 tools/tests/test_channel_database_migration.py
      - name: Test agent API transmit policy and independent tone modes
        run: bash tools/test_agent_api.sh
      - name: Generate compileOnly Android 8.1 HIDL signatures
        run: bash tools/build_hidl_compile_stubs.sh
      - name: Cross-compile llama.cpp and JNI for Android arm64-v8a
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash tools/build_llama_android.sh
      - name: Build Android 8.1 release and CI debug APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug -x lintVitalRelease
      - name: Validate contents, package metadata and checksums
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/RumiTX-v2.4.0-agent-api-UNSIGNED.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/RumiTX-v2.4.0-agent-api-CI-DEBUG.apk
          cp tools/sign_llama_bundled.sh dist/sign_llama_bundled.sh
          "$ANDROID_HOME/build-tools/33.0.2/aapt" dump badging dist/RumiTX-v2.4.0-agent-api-UNSIGNED.apk > dist/BADGING.txt
          grep -F "package: name='com.rumitx.app' versionCode='20400000' versionName='2.4.0-agent-api'" dist/BADGING.txt
          for lib in libllama.so libggml.so libggml-base.so libggml-cpu.so librumitx_llama_jni.so; do
            unzip -l dist/RumiTX-v2.4.0-agent-api-UNSIGNED.apk "lib/arm64-v8a/$lib" | tee -a dist/LIBRARY_SIZES.txt
          done
          cp app/src/main/jniLibs/arm64-v8a/*.so dist/
          (cd dist && sha256sum *.apk *.so > SHA256SUMS.txt)
          cat > dist/README.txt <<'EOF'
          RumiTX 2030 — v2.4.0-agent-api / versionCode 20400000
          Base: v2.3.1-source, including Voice TX PTT/channel programming guards.
          Pinned llama.cpp: b11206. Android ARM64 API 26 native .so libraries.
          AI runs via app-process JNI, no root, shell installer, ADB or standalone executable.
          The 1,107,409,344 byte GGUF is not embedded; it downloads to app private
          files on first use, verifies SHA-256 before loading, and then works offline.
          Google Drive public download availability is not verified by CI.
          Embedded model SHA-256 check:
          a9d99ed72848f0c26d2c380490108102aa19b47d565b192b7719e0d1f8832ba1

          THIS ARTIFACT IS UNSIGNED. The CI debug APK uses a DIFFERENT certificate.
          Original ThinkPad key: ~/rumitx-work/signing/local-debug.keystore
          Do not upload the key or uninstall the working app.
          Run sign_llama_bundled.sh on the ThinkPad, compare signing certificate to
          a previously installed original-key APK, then stage the signed artifact at
          /tmp/RumiTX-v2.4.0-agent-api.apk.
          No installation or on-device tests were run as directed.
          EOF
      - name: Upload bundled llama native release candidate
        uses: actions/upload-artifact@v4
        with:
          name: rumitx-v240-agent-api-unsigned
          path: dist/
          retention-days: 30
          if-no-files-found: error
