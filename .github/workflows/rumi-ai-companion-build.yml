name: Rumi AI Companion debug APK
on:
  push:
    branches: [feature/rumi-ai-companion-v01]
    paths:
      - 'rumi-ai-client/**'
      - '.github/workflows/rumi-ai-companion-build.yml'
  pull_request:
    paths:
      - 'rumi-ai-client/**'
      - '.github/workflows/rumi-ai-companion-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile isolated Android 8+ companion
        run: gradle -p rumi-ai-client --no-daemon :app:assembleDebug
      - name: Inspect built APK
        run: |
          APK=rumi-ai-client/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"
          unzip -t "$APK" | tail -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: RumiAI-Android8-debug-APK
          path: rumi-ai-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
